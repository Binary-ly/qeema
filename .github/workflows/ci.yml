# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_DB: qeema_test
  POSTGRES_USER: qeema
  POSTGRES_PASSWORD: qeema

jobs:

  # ---------------------------------------------------------------- PHP -----
  php:
    name: PHP — lint, analyse, test (80% gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        # The matcher needs pgvector and pg_trgm, so CI runs the same database
        # image as production. Testing against SQLite would prove nothing.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: qeema_test
          POSTGRES_USER: qeema
          POSTGRES_PASSWORD: qeema
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qeema -d qeema_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, zip, intl, bcmath
          # pcov is dramatically faster than xdebug for line coverage.
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare database extensions
        env:
          PGPASSWORD: qeema
        run: |
          psql -h 127.0.0.1 -U qeema -d qeema_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
            -c "CREATE SCHEMA IF NOT EXISTS qeema_eval;"

      - name: Check formatting
        working-directory: api
        run: ./vendor/bin/pint --test

      - name: OpenAPI spec is current
        working-directory: api
        run: php artisan qeema:openapi --check

      - name: Static analysis
        working-directory: api
        run: ./vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Tests with coverage gate
        working-directory: api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: qeema_test
          DB_USERNAME: qeema
          DB_PASSWORD: qeema
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest --coverage --min=80 --coverage-clover=coverage.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-coverage
          path: api/coverage.xml
          if-no-files-found: ignore

  # ----------------------------------------------------------------- ML -----
  ml:
    name: Python — lint, type-check, test (80% gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ml/pyproject.toml

      - name: Create environment
        working-directory: ml
        run: |
          uv venv --python 3.11 .venv
          # CPU-only torch: the CUDA build is ~800 MB and CI has no GPU.
          uv pip install --python .venv/bin/python \
            --index-url https://download.pytorch.org/whl/cpu "torch>=2.5"
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint
        working-directory: ml
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests

      - name: Type-check
        working-directory: ml
        run: .venv/bin/mypy src

      - name: Tests with coverage gate
        working-directory: ml
        # Model-loading tests are marked `slow` and excluded: downloading 1.1 GB
        # of weights on every run would make CI unusable. They run in the
        # nightly job instead.
        run: .venv/bin/python -m pytest -m "not slow" --cov --cov-report=xml --cov-report=term-missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-coverage
          path: ml/coverage.xml
          if-no-files-found: ignore

  # --------------------------------------------------------- compliance -----
  compliance:
    name: Constraint compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: No hardcoded country literals (C3)
        run: bash infra/scripts/check-country-agnostic.sh

      - name: Dependency licence inventory (C1)
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Generate licence inventory
        run: |
          bash infra/scripts/licenses.sh > docs/LICENSES.md
          echo "--- summary ---"
          grep -c '^|' docs/LICENSES.md || true

      - uses: actions/upload-artifact@v4
        with:
          name: licence-inventory
          path: docs/LICENSES.md

      - name: Fail if any secret-shaped value is committed
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
              -- . ':!*.md' ':!infra/scripts/*'; then
            echo "FAIL: possible secret committed"
            exit 1
          fi
          echo "OK: no secret-shaped values found"

  # ------------------------------------------------------- images/compose ---
  compose:
    name: One-command demo boots clean (C2)
    runs-on: ubuntu-latest
    # This is the headline requirement, so it runs on every PR despite costing
    # a full image build.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null 2>&1; then
              echo "app healthy after $((i * 5))s"
              curl -fsS http://localhost:8080/api/v1/health | tee /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "FAILED: stack did not become healthy"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Assert the database extensions are live
        run: |
          grep -q '"vector":true' /tmp/health.json
          grep -q '"pg_trgm":true' /tmp/health.json

      - name: Assert the ML service is ready
        # Block scalar: the pattern contains a colon-space, which YAML reads as
        # a nested mapping when the value is a plain scalar. The inner quotes
        # are part of the string, so they quote nothing.
        run: |
          curl -fsS http://localhost:8000/ready | grep -q '"models_loaded": *true'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
