# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_DB: qeema_test
  POSTGRES_USER: qeema
  POSTGRES_PASSWORD: qeema

jobs:

  # ---------------------------------------------------------------- PHP -----
  php:
    name: PHP — lint, analyse, test (80% gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        # The matcher needs pgvector and pg_trgm, so CI runs the same database
        # image as production. Testing against SQLite would prove nothing.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: qeema_test
          POSTGRES_USER: qeema
          POSTGRES_PASSWORD: qeema
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qeema -d qeema_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, zip, intl, bcmath
          # pcov is dramatically faster than xdebug for line coverage.
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: api
        run: bash "$GITHUB_WORKSPACE/infra/scripts/retry.sh" 3 composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare database extensions
        env:
          PGPASSWORD: qeema
        run: |
          psql -h 127.0.0.1 -U qeema -d qeema_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
            -c "CREATE SCHEMA IF NOT EXISTS qeema_eval;"

      # public/build is generated, so it is gitignored and absent in CI. Blade
      # views call @vite(), which reads the manifest from there — without this
      # every test that renders a page dies on "Vite manifest not found".
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Build frontend assets
        working-directory: api
        run: |
          bash "$GITHUB_WORKSPACE/infra/scripts/retry.sh" 3 npm ci
          npm run build

      # The suite is designed to run without a .env — phpunit.xml carries the
      # test key and the test database on purpose, so a fresh clone works. But
      # the framework still *reads* one, and a missing file emitted a PHP
      # warning on every single test: 536 of them, hiding any warning that
      # actually mattered.
      #
      # Empty rather than a copy of .env.example, which sets a different
      # database and an empty APP_KEY. The values belong to phpunit.xml; this
      # only gives the framework something to open.
      - name: Provide an empty env file
        working-directory: api
        run: touch .env

      # Invoked through the Makefile rather than repeated here, so a gate cannot
      # exist in CI without a local equivalent. That gap is not hypothetical: it
      # is how both of this pipeline's self-inflicted failures happened, each
      # time a country name in a comment that `make lint` never looked at.
      - name: Static gates
        run: make gate-php-static
        env:
          PHPSTAN_FORMAT: github

      - name: Tests with coverage gate
        working-directory: api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: qeema_test
          DB_USERNAME: qeema
          DB_PASSWORD: qeema
          REDIS_HOST: 127.0.0.1
          # The reporter truncates each line to the terminal width, and CI has
          # no terminal. Without this a per-test warning reads as
          # "file_get_contents(/home/r…" and cannot be diagnosed from the log.
          COLUMNS: '220'
        # JUnit output as well as coverage: the compact reporter truncates a
        # test's warnings to fit a terminal, so a suite that emits one warning
        # per test — which this one does, and has since before anyone noticed —
        # is unreadable from the log alone. The XML carries the full message.
        run: ./vendor/bin/pest --coverage --min=80 --coverage-clover=coverage.xml --log-junit junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-test-results
          path: |
            api/coverage.xml
            api/junit.xml
          if-no-files-found: ignore

  # ----------------------------------------------------------------- ML -----
  ml:
    name: Python — lint, type-check, test (80% gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ml/pyproject.toml

      - name: Create environment
        working-directory: ml
        run: |
          uv venv --python 3.11 .venv
          # CPU-only torch: the CUDA build is ~800 MB and CI has no GPU.
          bash "$GITHUB_WORKSPACE/infra/scripts/retry.sh" 3 uv pip install --python .venv/bin/python \
            --index-url https://download.pytorch.org/whl/cpu "torch>=2.5"
          bash "$GITHUB_WORKSPACE/infra/scripts/retry.sh" 3 uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Static gates
        run: make gate-ml-static

      - name: Tests with coverage gate
        working-directory: ml
        # Model-loading tests are marked `slow` and excluded: downloading 1.1 GB
        # of weights on every run would make CI unusable. They run in the
        # nightly job instead.
        run: .venv/bin/python -m pytest -m "not slow" --cov --cov-report=xml --cov-report=term-missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-coverage
          path: ml/coverage.xml
          if-no-files-found: ignore

  # --------------------------------------------------------- compliance -----
  compliance:
    name: Constraint compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      # C3, workflow validity and the secret scan. The secret scan used to be
      # written inline below, which made the one gate guarding the thing you
      # cannot take back the one gate nobody could run locally.
      - name: Constraint gates
        run: make gate-constraints

      - name: Dependency licence inventory (C1)
        working-directory: api
        run: bash "$GITHUB_WORKSPACE/infra/scripts/retry.sh" 3 composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Generate licence inventory
        run: |
          bash infra/scripts/licenses.sh > docs/LICENSES.md
          echo "--- summary ---"
          grep -c '^|' docs/LICENSES.md || true

      - uses: actions/upload-artifact@v4
        with:
          name: licence-inventory
          path: docs/LICENSES.md

      # The secret scan now runs in the "Constraint gates" step above, out of
      # infra/scripts/check-secrets.sh, so `make lint` and the pre-push hook run
      # it too.

  # ------------------------------------------------------- images/compose ---
  compose:
    name: One-command demo boots clean, and the loop closes (C2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This is the headline requirement, so it runs on every PR despite costing
    # a full image build.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The ML image bakes the embedding weights on top of a CPU torch install
      # (D-09), which does not fit alongside the runner's preinstalled
      # toolchains. Reclaiming ~20 GB is cheaper than weakening the constraint
      # that the model ships in the image.
      - name: Reclaim runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h / | tail -1

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null 2>&1; then
              echo "app healthy after $((i * 5))s"
              curl -fsS http://localhost:8080/api/v1/health | tee /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "FAILED: stack did not become healthy"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Assert the database extensions are live
        run: |
          grep -q '"vector":true' /tmp/health.json
          grep -q '"pg_trgm":true' /tmp/health.json

      - name: Assert the ML service is ready
        # Block scalar: the pattern contains a colon-space, which YAML reads as
        # a nested mapping when the value is a plain scalar. The inner quotes
        # are part of the string, so they quote nothing.
        run: |
          curl -fsS http://localhost:8000/ready | grep -q '"models_loaded": *true'

      # The stack is already up, so the end-to-end suite rides along rather than
      # paying for a second image build. This is where the headline claim gets
      # proved on every push instead of being demonstrated by hand: a price
      # posted to the public API reaches the published index on its own, with
      # the shipped defaults and nobody running a command.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          bash "$GITHUB_WORKSPACE/infra/scripts/retry.sh" 3 npm ci
          bash "$GITHUB_WORKSPACE/infra/scripts/retry.sh" 3 npx playwright install chromium --with-deps

      - name: End-to-end, against the composed stack
        working-directory: e2e
        # The loop test waits out the publish grace window and a drain cycle,
        # so it is minutes rather than seconds by design — it is measuring the
        # real cadence, not a shortened one.
        run: npx playwright test

      # `always()`, not `if: failure()`. A *flaky* test fails and then passes on
      # retry, so the job succeeds and the trace of the failure was thrown away
      # — which is exactly why the one flaky test here is still undiagnosed
      # after several occurrences. The traces are only written when something
      # failed, so this uploads nothing on a clean run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=300

      # Container logs alone could not explain a loop failure: they showed the
      # resolve job completing in 44ms and no error anywhere, while the price
      # never reached the index. What the submission actually became is a
      # database question, so ask the database.
      - name: Say what happened to the last submission
        if: failure()
        run: |
          docker compose exec -T app php artisan tinker --execute='
            $s = App\Models\Submission::latest("created_at")->first();
            if ($s === null) { echo "no submissions at all\n"; return; }
            echo "submission: {$s->id}\n  raw_text: {$s->raw_text}\n  status: {$s->status}\n";
            echo "  observed_at: {$s->observed_at}\n";
            $r = $s->resolution;
            echo "  resolution: ".($r === null ? "none" : "{$r->method} conf={$r->confidence} item={$r->canonical_item_id}")."\n";
            echo "  observation: ".($s->priceObservation === null ? "NONE — this is why the index did not move" : "created")."\n";
            echo "  stale snapshots: ".App\Models\IndexSnapshot::where("is_stale", true)->count()."\n";
            echo "  pending jobs: ".DB::table("jobs")->count()."   failed: ".DB::table("failed_jobs")->count()."\n";

            // The loop test polls one location and one date. An observation that
            // lands on a date nothing has published, or on a date the test is not
            // watching, is invisible to it however healthy the pipeline is.
            foreach (App\Models\Country::where("is_active", true)->get() as $c) {
              $latest = App\Models\IndexSnapshot::where("country_id", $c->id)->max("snapshot_date");
              $today  = \Carbon\CarbonImmutable::now($c->timezone)->toDateString();
              echo "\n{$c->code}: latest published snapshot {$latest} | today there {$today}\n";
            }
            // Neither "latest" nor "has a reporter" finds the submission under
            // test: the scheduled scraper creates them constantly and the demo
            // seeds thousands. The loop test posts a price of exactly 12.5,
            // which nothing else in the system does.
            $mine = App\Models\Submission::where("raw_price", 12.5)
              ->orderByDesc("created_at")->take(3)->get();
            echo "\nsubmissions posted by the loop test: ".$mine->count()."\n";
            foreach ($mine as $m) {
              $mr = $m->resolution;
              echo "  text={$m->raw_text} | status={$m->status}";
              echo " | observation=".($m->priceObservation === null ? "NONE" : "yes")."\n";
              echo "    resolution=".($mr === null ? "none" : $mr->method." conf=".$mr->confidence." item=".$mr->canonical_item_id)."\n";
              echo "    notes=".($mr?->notes ?? "-")." | location={$m->location_id} | observed_at={$m->observed_at}\n";
            }

            // One snapshot stayed stale for the whole 240s window while the
            // recompute task ran every minute. Either it is being skipped or it
            // is throwing, and only trying it says which.
            foreach (App\Models\IndexSnapshot::where("is_stale", true)->take(3)->get() as $snap) {
              echo "\nSTALE snapshot: location={$snap->location_id} date={$snap->snapshot_date}";
              echo " marked={$snap->stale_marked_at} level={$snap->index_level}\n";
              try {
                app(App\Services\Index\IndexCalculator::class)->calculate(
                  $snap->country, $snap->location, $snap->basket,
                  \Carbon\CarbonImmutable::instance($snap->snapshot_date->toDateTime()),
                );
                echo "  recomputing it by hand SUCCEEDED — so the scheduler was not reaching it\n";
              } catch (\Throwable $e) {
                echo "  recomputing it by hand THREW: ".get_class($e).": ".$e->getMessage()."\n";
              }
            }
          ' || true
          docker compose exec -T app php artisan qeema:pipeline:health || true

      - name: Tear down
        if: always()
        run: docker compose down -v
