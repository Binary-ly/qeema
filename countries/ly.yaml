# SPDX-License-Identifier: Apache-2.0
#
# Libya — default country configuration.
#
# This file is the ONLY place Libya-specific facts may live. Application code
# reads all of this from the database after seeding and never assumes any of it
# (constraint C3). Adding a country means adding a file like this one, not
# patching code.
#
# Seed with:  php artisan qeema:bootstrap --force

country:
  code: LY
  name: Libya
  name_local: ليبيا
  currency:
    code: LYD
    symbol: "د.ل"
    # The dinar is subdivided into 1000 dirham, not 100. Assuming two decimal
    # places — as most currency code does — would silently misprice everything.
    minor_units: 3
  timezone: Africa/Tripoli
  locales: [ar, en]
  default_locale: ar
  admin_labels:
    admin1: Municipality
    admin2: District

# ---------------------------------------------------------------------------
# Exchange rates
# ---------------------------------------------------------------------------
# The gap between the official and parallel rate is the single most important
# number for this index. Costing a basket at the official rate would produce a
# USD figure describing a transaction ordinary people cannot make.
fx:
  provider: manual          # manual | generic_http
  base_currency: USD
  rate_type: parallel
  max_staleness_days: 7
  config: {}
  #
  # Manual entry is the shipped default, and that is a constraint rather than an
  # oversight. The platform depends on no proprietary or paid third-party API
  # (C1), and the parallel-rate sources that exist for the dinar are behind an
  # API key — including fulus.ly, whose /api/v1/rates/current answers 401
  # without one. Enabling any of them here would give every deployment of this
  # repository an account to create and a secret to keep, and would make the
  # "no third-party keys, by construction" claim in SECURITY.md untrue.
  #
  # An operator who has their own key can use it. Nothing in the application
  # knows the service exists; it reads whatever JSON endpoint this names:
  #
  # provider: generic_http
  # config:
  #   url: https://fulus.ly/api/v1/rates/current
  #   parallel_path: data.parallel.sell     # confirm against the live payload
  #   official_path: data.official.sell
  #   date_path: data.updated_at
  #   auth_header: Authorization
  #   auth_token_env: FX_API_TOKEN        # the token itself lives in the
  #                                         # environment, never in this file,
  #                                         # which is in version control
  #
  # Two things to settle before switching it on: that the terms of use permit
  # automated access for this purpose, and that the paths above match what the
  # endpoint actually returns — they are a guess made without a key, and a wrong
  # path yields no rate rather than a wrong one, which the health check reports.

# ---------------------------------------------------------------------------
# Index estimator settings
# ---------------------------------------------------------------------------
index:
  observation_window_days: 7
  recency_half_life_days: 3
  min_observations_for_ci: 3
  bootstrap_draws: 500
  # Unset on purpose. The base period is the date at which the index reads 100,
  # and a fixed date here only stays meaningful while the deployment holds data
  # covering it — the demo's history window always ends today and rolls forward,
  # so any date written here drifts out of range and every location would be left
  # with no anchor and no published level.
  #
  # Left null, the base period becomes the first day the basket could be priced in
  # full. That is measured rather than asserted, it is recorded on the anchor, and
  # it is immutable once written.
  #
  # A real deployment should set the month collection genuinely began, and will
  # then be told loudly if there is no data there rather than being quietly
  # anchored somewhere else.
  base_date: null

# ---------------------------------------------------------------------------
# Units
# ---------------------------------------------------------------------------
units:
  - { code: kg,    name: Kilogram,   name_local: كيلوغرام, dimension: mass,   base_unit_code: kg,    factor_to_base: 1, aliases: [كيلوغرام, كيلوجرام, كيلو, كيلوا, كجم, كغم, كغ, ك, kg] }
  - { code: g,     name: Gram,       name_local: غرام,     dimension: mass,   base_unit_code: kg,    factor_to_base: 0.001, aliases: [غرام, جرام, غم, جم, غ, g, gm] }
  - { code: l,     name: Litre,      name_local: لتر,      dimension: volume, base_unit_code: l,     factor_to_base: 1, aliases: [لتر, لترات, ليتر, l, ltr] }
  - { code: ml,    name: Millilitre, name_local: مليلتر,   dimension: volume, base_unit_code: l,     factor_to_base: 0.001, aliases: [مليلتر, ملي, مل, ml, cc] }
  - { code: piece, name: Piece,      name_local: قطعة,     dimension: count,  base_unit_code: piece, factor_to_base: 1, aliases: [قطعة, قطعه, حبة, حبه, حبات, piece, pcs] }
  - { code: pack,  name: Pack,       name_local: علبة,     dimension: count,  base_unit_code: piece, factor_to_base: 1, aliases: [علبة, علبه, عبوة, عبوه, قوطية, قوطيه, باكو, كيس, pack] }
  - { code: dozen, name: Dozen,      name_local: دزينة,    dimension: count,  base_unit_code: piece, factor_to_base: 12, aliases: [دستة, دسته, دزينة, dozen] }

# ---------------------------------------------------------------------------
# Locations
# ---------------------------------------------------------------------------
# A deliberate spread across the coast, the interior and the south. The coastal
# / interior gradient matters: supply lines differ sharply, and an index that
# only sampled Tripoli and Benghazi would miss most of the hardship.
