    cooking_gas_11kg:
      value: 28.0
      as_of: 2026-08
      confidence: contested
      note: >-
        **The value is unchanged on purpose.** Research established the bounds
        and not the answer: Brega, the state oil marketing company, prices an
        11kg refill at 1.50 LYD, while cylinders sell on the street at around
        60. That is a fortyfold gap, and which one a family pays depends on
        whether they can get a subsidised cylinder through the booking system —
        a share nobody publishes. Replacing one guess with another would not be
        progress, so 28.0 stands and now carries its uncertainty instead of
        hiding it.

        This is the platform's own thesis appearing in a commodity rather than
        a currency: an official price that exists on paper and a real price
        people transact at. Worth pricing properly during the pilot; a
        reporter standing at a depot knows which number is real that day.

        A caution for whoever revisits this: the 240 LYD figure widely quoted
        is a refundable deposit on the cylinder, not a price. The source below
        says so in as many words.
      sources:
        - url: https://www.facebook.com/brega.company.bmc/posts/798662992457067/
          date: 2026
          kind: official-price
          says: >-
            Brega Oil Marketing Company: "الأسطوانة بوزن 15 كيلو جرام: 2.00
            دينار - الأسطوانة بوزن 11 كيلو جرام: 1.50 دينار" — the official
            subsidised refill price.
        - url: https://www.facebook.com/network.salam/videos/637494080411493/
          date: 2026
          kind: citizen-report
          says: >-
            Salam TV: "السوق السوداء.. سعر أسطوانة الغاز بـ60 دينارًا" — 60 LYD
            on the black market.
        - url: https://almashhadlibya.com/economic-news/120393
          date: 2026-03-04
          kind: news
          says: >-
            On the booking system: "حددت الشركة قيمة الضمان المالي للأسطوانة بـ
            240 دينارًا ليبيًا. هذا المبلغ لا يُعتبر سعر بيع، بل هو تأمين يُسترد
            بالكامل عند إعادة الأسطوانة" — the 240 is a refundable deposit, not
            a sale price.

