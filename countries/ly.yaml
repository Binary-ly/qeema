# ---------------------------------------------------------------------------
# The basket
# ---------------------------------------------------------------------------
# Child-weighted, NOT a general CPI. Weights are the share of a household's
# child-related outlay each item represents, and must sum to 1.0 exactly.
# Quantities are what the basket physically contains and drive the cost.
basket:
  name: Child Affordability Basket
  version: 1
  effective_from: 2026-01-01
  items:
    - { item: infant_formula_400g,          weight: 0.13, quantity: 1,  unit: pack,  category: infant_nutrition }
    - { item: baby_cereal_400g,             weight: 0.05, quantity: 1,  unit: pack,  category: infant_nutrition }
    - { item: wheat_flour_1kg,              weight: 0.10, quantity: 5,  unit: kg,    category: staples }
    - { item: rice_1kg,                     weight: 0.08, quantity: 3,  unit: kg,    category: staples }
    - { item: cooking_oil_1l,               weight: 0.08, quantity: 2,  unit: l,     category: staples }
    - { item: eggs_30,                      weight: 0.07, quantity: 30, unit: piece, category: protein }
    - { item: chicken_1kg,                  weight: 0.08, quantity: 2,  unit: kg,    category: protein }
    - { item: tomatoes_1kg,                 weight: 0.05, quantity: 3,  unit: kg,    category: produce }
    - { item: ors_sachet,                   weight: 0.04, quantity: 6,  unit: piece, category: medicine }
    - { item: paracetamol_suspension_60ml,  weight: 0.04, quantity: 60, unit: ml,    category: medicine }
    - { item: amoxicillin_suspension_60ml,  weight: 0.03, quantity: 60, unit: ml,    category: medicine }
    - { item: school_notebook_80p,          weight: 0.03, quantity: 4,  unit: piece, category: school }
    - { item: sanitary_pads_10,             weight: 0.06, quantity: 2,  unit: pack,  category: hygiene }
    - { item: cooking_gas_11kg,             weight: 0.10, quantity: 1,  unit: piece, category: fuel }
    - { item: drinking_water_20l,           weight: 0.06, quantity: 60, unit: l,     category: water }

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
sources:
  - { type: reporter,       slug: community-reporters, name: Community reporters, license: CC-BY-4.0 }
  - { type: partner_upload, slug: partner-uploads,     name: Partner organisations, license: CC-BY-4.0 }

# ---------------------------------------------------------------------------
# Synthetic demo data (Phase 2)
# ---------------------------------------------------------------------------
# Reference prices in LYD as of the base date, used only to seed the generator.
# These are plausible starting points for a demo, not measured values, and the
# API marks all generated data as synthetic.
demo:
  seed: 20260101
  months: 6
  reporters_per_location: 4
  # Southern and interior locations run structurally dearer: longer supply
  # lines, thinner competition.
  regional_premium:
    sabha: 1.18
    ubari: 1.26
    murzuq: 1.30
    ghat: 1.34
    ajdabiya: 1.08
    gharyan: 1.05
  monthly_inflation: 0.021
  fx_start_parallel: 7.60
  fx_start_official: 4.85
  reference_prices:
    infant_formula_400g: 32.0
    baby_cereal_400g: 18.5
    wheat_flour_1kg: 4.2
    rice_1kg: 6.5
    cooking_oil_1l: 9.0
    eggs_30: 24.0
    chicken_1kg: 17.5
    tomatoes_1kg: 4.0
    ors_sachet: 1.5
    paracetamol_suspension_60ml: 8.0
    amoxicillin_suspension_60ml: 14.0
    school_notebook_80p: 3.0
    sanitary_pads_10: 12.0
    cooking_gas_11kg: 28.0
    drinking_water_20l: 6.0
