# SPDX-License-Identifier: Apache-2.0
#
# Libya — default country configuration.
#
# This file is the ONLY place Libya-specific facts may live. Application code
# reads all of this from the database after seeding and never assumes any of it
# (constraint C3). Adding a country means adding a file like this one, not
# patching code.
#
# Seed with:  php artisan qeema:bootstrap --force

country:
  code: LY
  name: Libya
  name_local: ليبيا
  currency:
    code: LYD
    symbol: "د.ل"
    # The dinar is subdivided into 1000 dirham, not 100. Assuming two decimal
    # places — as most currency code does — would silently misprice everything.
    minor_units: 3
  timezone: Africa/Tripoli
  locales: [ar, en]
  default_locale: ar
  admin_labels:
    admin1: Municipality
    admin2: District

# ---------------------------------------------------------------------------
# Exchange rates
# ---------------------------------------------------------------------------
# The gap between the official and parallel rate is the single most important
# number for this index. Costing a basket at the official rate would produce a
# USD figure describing a transaction ordinary people cannot make.
fx:
  provider: manual          # manual | generic_http | fulus_ly
  base_currency: USD
  rate_type: parallel
  max_staleness_days: 7
  config: {}
  # The Fulus.ly adapter is deliberately NOT the default: its terms of use have
  # not been reviewed, and shipping a scraper enabled-by-default against a third
  # party's site would be inconsiderate at best. See PLAN.md §11 open question 2.
  #
  # provider: generic_http
  # config:
  #   url: https://example.org/rates.json
  #   official_path: "$.rates.official"
  #   parallel_path: "$.rates.parallel"

# ---------------------------------------------------------------------------
# Index estimator settings
# ---------------------------------------------------------------------------
index:
  observation_window_days: 7
  recency_half_life_days: 3
  min_observations_for_ci: 3
  bootstrap_draws: 500
  base_date: 2026-01-01

# ---------------------------------------------------------------------------
# Units
# ---------------------------------------------------------------------------
units:
  - { code: kg,    name: Kilogram,   name_local: كيلوغرام, dimension: mass,   base_unit_code: kg,    factor_to_base: 1 }
  - { code: g,     name: Gram,       name_local: غرام,     dimension: mass,   base_unit_code: kg,    factor_to_base: 0.001 }
  - { code: l,     name: Litre,      name_local: لتر,      dimension: volume, base_unit_code: l,     factor_to_base: 1 }
  - { code: ml,    name: Millilitre, name_local: مليلتر,   dimension: volume, base_unit_code: l,     factor_to_base: 0.001 }
  - { code: piece, name: Piece,      name_local: قطعة,     dimension: count,  base_unit_code: piece, factor_to_base: 1 }
  - { code: pack,  name: Pack,       name_local: علبة,     dimension: count,  base_unit_code: piece, factor_to_base: 1 }
  - { code: dozen, name: Dozen,      name_local: دزينة,    dimension: count,  base_unit_code: piece, factor_to_base: 12 }

# ---------------------------------------------------------------------------
# Locations
# ---------------------------------------------------------------------------
# A deliberate spread across the coast, the interior and the south. The coastal
# / interior gradient matters: supply lines differ sharply, and an index that
# only sampled Tripoli and Benghazi would miss most of the hardship.
locations:
  - { name: Tripoli,   name_local: طرابلس,      slug: tripoli,   admin1_name: Tripoli,       admin1_code: LY-TB, latitude: 32.8872, longitude: 13.1913, population_estimate: 1150000 }
  - { name: Benghazi,  name_local: بنغازي,      slug: benghazi,  admin1_name: Benghazi,      admin1_code: LY-BA, latitude: 32.1167, longitude: 20.0667, population_estimate: 650000 }
  - { name: Misrata,   name_local: مصراتة,      slug: misrata,   admin1_name: Misrata,       admin1_code: LY-MI, latitude: 32.3754, longitude: 15.0925, population_estimate: 280000 }
  - { name: Zawiya,    name_local: الزاوية,     slug: zawiya,    admin1_name: Zawiya,        admin1_code: LY-ZA, latitude: 32.7522, longitude: 12.7278, population_estimate: 200000 }
  - { name: Zliten,    name_local: زليتن,       slug: zliten,    admin1_name: Murqub,        admin1_code: LY-MB, latitude: 32.4674, longitude: 14.5687, population_estimate: 140000 }
  - { name: Khoms,     name_local: الخمس,       slug: khoms,     admin1_name: Murqub,        admin1_code: LY-MB, latitude: 32.6486, longitude: 14.2619, population_estimate: 120000 }
  - { name: Sirte,     name_local: سرت,         slug: sirte,     admin1_name: Sirte,         admin1_code: LY-SR, latitude: 31.2089, longitude: 16.5887, population_estimate: 130000 }
  - { name: Tobruk,    name_local: طبرق,        slug: tobruk,    admin1_name: Butnan,        admin1_code: LY-BU, latitude: 32.0836, longitude: 23.9764, population_estimate: 120000 }
  - { name: Derna,     name_local: درنة,        slug: derna,     admin1_name: Derna,         admin1_code: LY-DR, latitude: 32.7556, longitude: 22.6389, population_estimate: 90000 }
  - { name: Bayda,     name_local: البيضاء,     slug: bayda,     admin1_name: Jabal al Akhdar, admin1_code: LY-JA, latitude: 32.7627, longitude: 21.7551, population_estimate: 120000 }
  - { name: Ajdabiya,  name_local: أجدابيا,     slug: ajdabiya,  admin1_name: Wahat,         admin1_code: LY-WA, latitude: 30.7554, longitude: 20.2263, population_estimate: 76000 }
  - { name: Gharyan,   name_local: غريان,       slug: gharyan,   admin1_name: Jabal al Gharbi, admin1_code: LY-JG, latitude: 32.1722, longitude: 13.0203, population_estimate: 90000 }
  - { name: Sabha,     name_local: سبها,        slug: sabha,     admin1_name: Sabha,         admin1_code: LY-SB, latitude: 27.0377, longitude: 14.4283, population_estimate: 130000 }
  - { name: Ubari,     name_local: أوباري,      slug: ubari,     admin1_name: Wadi al Hayat, admin1_code: LY-WD, latitude: 26.5921, longitude: 12.7764, population_estimate: 40000 }
  - { name: Murzuq,    name_local: مرزق,        slug: murzuq,    admin1_name: Murzuq,        admin1_code: LY-MQ, latitude: 25.9155, longitude: 13.9184, population_estimate: 35000 }
  - { name: Ghat,      name_local: غات,         slug: ghat,      admin1_name: Ghat,          admin1_code: LY-GT, latitude: 24.9647, longitude: 10.1800, population_estimate: 25000 }

