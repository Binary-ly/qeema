# ---------------------------------------------------------------------------
# Synthetic demo data (Phase 2)
# ---------------------------------------------------------------------------
# Reference prices in LYD as of the base date, used only to seed the generator.
# These are plausible starting points for a demo, not measured values, and the
# API marks all generated data as synthetic.
demo:
  seed: 20260101
  months: 6
  reporters_per_location: 4
  # Southern and interior locations run structurally dearer: longer supply
  # lines, thinner competition.
  # Two measurements from the same agency disagree, and the disagreement is the
  # point.
  #
  # **Food staples only.** Costing an identical 21-commodity bundle across all
  # 21 markets in WFP's price series (2026, `priceflag: actual`) makes the south
  # the *cheapest* part of the country — Sebha 180.41 against Ejdabia's 240.81,
  # a 1.33x spread, with southern wheat flour at 0.84x the northern price.
  # Subsidised staples reach the south.
  #
  # **The whole basket.** WFP's own Minimum Expenditure Basket for May 2026 —
  # food *plus* hygiene and cooking fuel — ranks **Murzuq the most expensive
  # city in Libya at 1,296 LYD** and Sebha the cheapest at 952, a 1.36x spread.
  #
  # Both are true: the south is cheap on subsidised food and dear on everything
  # that has to be trucked there. This basket is roughly 40% non-food — cooking
  # gas, drinking water, paediatric medicine, school materials — so the southern
  # premium belongs, and a food-only measurement is the wrong instrument for
  # setting it. These were briefly halved on that mistaken basis and are
  # restored.
  regional_premium:
    sabha: 1.18
    ubari: 1.26
    murzuq: 1.30
    ghat: 1.34
    ajdabiya: 1.08
    gharyan: 1.05
  monthly_inflation: 0.021
  fx_start_parallel: 7.60
  fx_start_official: 4.85
  reference_prices:
    infant_formula_400g: 32.0
    baby_cereal_400g: 18.5
    wheat_flour_1kg: 3.88
    rice_1kg: 6.06
    cooking_oil_1l: 14.12
    eggs_30: 24.75
    chicken_1kg: 31.0
    tomatoes_1kg: 3.0
    ors_sachet: 1.5
    paracetamol_suspension_60ml: 8.0
    amoxicillin_suspension_60ml: 14.0
    school_notebook_80p: 2.3
    sanitary_pads_10: 12.0
    cooking_gas_11kg: 28.0
    drinking_water_7l: 4.0
    # Catalogued but outside basket v1 (see the note on those items above).
    # They carry reference prices because the generator prices every catalogued
    # item, so that a v2 basket adding them can be chain-linked against days on
    # which they were already being reported.
    ballpoint_pen: 1.5
    school_backpack: 45.0
    bath_soap_bar: 3.5

  # ---------------------------------------------------------------------
  # Where these numbers came from
  # ---------------------------------------------------------------------
  # A price with no citation is somebody's guess wearing a decimal point. The
  # water line sat at 3.00 for exactly that reason — one news article, five
  # months stale, read as current — until a Libyan reader said it was too cheap
  # and it turned out to be the figure at the *start* of a 50% spike.
  #
  # So a price may declare its sources here, and
  # tests/Feature/Country/ReferencePriceProvenanceTest.php enforces three
  # things: a declared value must match the price above it, every source must
  # carry a URL and a date, and the count of sourced prices may never fall.
  # That last one is a ratchet — it makes sourcing incremental rather than
  # all-or-nothing, and makes deleting a citation a test failure.
  #
  # `confidence` is about corroboration, not certainty:
  #   corroborated  — two or more independent sources agree
  #   single-source — one source, which may be stale or unrepresentative
  #   (absent)      — no citation; the number is a plausible guess and nothing more
  reference_price_provenance:
    drinking_water_7l:
      value: 4.0
      as_of: 2026-08
      confidence: corroborated
      note: >-
        Cross-checked per litre against a field survey: a 0.5L bottle at 0.750
        LYD is 1.50/litre and a twelve-bottle دستة at 7 LYD is 1.167/litre, so a
        7L jug at 4 LYD — 0.571/litre — is the cheap bulk format, which is the
        shape you would expect. The same reporting puts Ubari at 5 LYD, which is
        direct evidence of a southern premium measured on a non-food item.
      sources:
        - url: https://almashhadlibya.com/economic-news/134313
          date: 2026-08-18
          kind: field-survey
          says: >-
            Almashhad Libya, reporting a رصد ميداني by اقتصاد المسار across
            Tripoli retail shops: a دستة of twelve half-litre bottles at 7 LYD,
            up 40-70% on early July; 8-10 LYD in late July when several
            factories stopped for power cuts; a half-litre bottle at 0.750 LYD
            in grocery shops and 1 LYD in cafes.
        - url: https://libyaalahrar.tv/2026/04/03/water-prices
          date: 2026-04-03
          kind: news
          says: >-
            The 7-litre container known as the بانقة reaching 3 dinars, a rise
            of 50%. This is the figure that was mistakenly used as current.
        - url: https://www.facebook.com/OnlyLibya/posts/1448078177356436/
          date: 2026
          kind: citizen-report
          says: >-
            A 7-litre بانقة at 4 dinars, corroborated by several independent
            citizen videos including one carried by Arraed TV.

    wheat_flour_1kg:
      value: 3.88
      as_of: 2026-05
      confidence: single-source
      note: >-
        Replaced a guessed 4.2. WFP is one source, but it is a UN agency's own
        field collection under an open licence, which is a different kind of
        single source from one news article.
      sources:
        - url: https://data.humdata.org/dataset/wfp-food-prices-for-libya
          date: 2026-05-15
          kind: official-dataset
          says: >-
            WFP Libya food prices, series "Wheat flour, KG", Tripoli centre, median of
            the March-May 2026 observations carrying priceflag=actual.
            CC BY-IGO 3.0.
    rice_1kg:
      value: 6.06
      as_of: 2026-05
      confidence: single-source
      note: >-
        Replaced a guessed 6.5. WFP is one source, but it is a UN agency's own
        field collection under an open licence, which is a different kind of
        single source from one news article.
      sources:
        - url: https://data.humdata.org/dataset/wfp-food-prices-for-libya
          date: 2026-05-15
          kind: official-dataset
          says: >-
            WFP Libya food prices, series "Rice, KG", Tripoli centre, median of
            the March-May 2026 observations carrying priceflag=actual.
            CC BY-IGO 3.0.
    cooking_oil_1l:
      value: 14.12
      as_of: 2026-04
      confidence: contested
      note: >-
        Two credible sources, the same months, 55% apart. WFP normalises to a
        litre and reports 9.67; Libya's own Ministry of Economy field survey
        prices the bottle Libyans actually buy - 850 ml - at 11.50 for sunflower
        and 12.50 for corn, which is 13.53 and 14.71 a litre. A man filmed in
        Bani Walid in August put "علبة الزيت" at twelve to thirteen dinar, which
        is the bottle, not the litre, and lands on the Ministry's number.
        Two independent Libyan sources against one international series, so the
        value is the mean of the Ministry's two oils, 12.00 per 850 ml.
        What is not resolved is why WFP is low. The suspicion is its litre
        normalisation: if a bottle priced at ~12 is recorded as a litre rather
        than as 850 ml, the per-litre figure comes out 15% light, and that is
        most of the gap. Recorded as contested rather than silently corrected,
        because the disagreement is the finding.
      sources:
        - url: https://data.humdata.org/dataset/wfp-food-prices-for-libya
          date: 2026-05-15
          kind: official-dataset
          says: >-
            WFP Libya food prices, series "Oil (vegetable), L", Tripoli centre, median of
            the March-May 2026 observations carrying priceflag=actual, gives 9.67 per litre.
            CC BY-IGO 3.0.
        - url: https://ltnet.gov.ly/ar/wp-content/uploads/2026/05/%D9%86%D8%B4%D8%B1%D8%A9-%D8%A7%D8%A8%D8%B1%D9%8A%D9%84-2026.pdf
          date: 2026-04-30
          kind: official-dataset
          says: >-
            Libya Trade Network (Ministry of Economy and Trade), monthly analytical
            bulletin for April 2026, food sector. زيت الذرة 12.500 and زيت عباد الشمس
            11.500 dinar, both for the 850 ml bottle the bulletin names in its own
            column header. Daily field survey.
        - url: https://www.facebook.com/almenssalibya/videos/2002898300431178/
          date: 2026-08
          kind: street-report
          says: >-
            A resident of Bani Walid, on camera in an August 2026 street survey,
            gives "علبة الزيت بطنعش تلتاشر دينار" - the tin of oil at twelve or
            thirteen dinar.
    eggs_30:
      value: 24.75
