# SPDX-License-Identifier: Apache-2.0
#
# Venezuela — second country configuration.
#
# This file exists to prove constraint C3 rather than to assert expertise about
# Venezuela. It was chosen as the second country because it differs from the
# default along every axis the code could plausibly have hardcoded:
#
#   - Spanish, not Arabic, and **left-to-right**, not RTL.
#   - Latin script throughout, so the Arabic normalisation path is bypassed
#     entirely rather than exercised.
#   - A different staple. The basket is built on precooked maize flour, which is
#     what arepas are made from; wheat flour is not the centre of the diet here.
#     A basket that assumed wheat would be measuring the wrong thing.
#   - Two-decimal currency, against the dinar's three.
#   - A Western-hemisphere timezone and negative longitudes, which the map
#     projection and the date bucketing both have to survive.
#
# The reference prices and regional premiums below are plausible figures for a
# demonstration, not measured values, and everything generated from them is
# marked synthetic. A real deployment replaces the `demo:` block with actual
# reporting.
#
# Seed with:  php artisan qeema:bootstrap --country=VE --force

country:
  code: VE
  name: Venezuela
  name_local: Venezuela
  currency:
    code: VES
    symbol: "Bs."
    minor_units: 2
  timezone: America/Caracas
  locales: [es, en]
  default_locale: es
  admin_labels:
    admin1: Estado
    admin2: Municipio

# ---------------------------------------------------------------------------
# Exchange rates
# ---------------------------------------------------------------------------
# Same reasoning as the default country, different magnitude. Where the parallel
# market carries most real transactions, costing a basket at the official rate
# produces a dollar figure describing a purchase ordinary people cannot make.
fx:
  provider: manual
  base_currency: USD
  rate_type: parallel
  max_staleness_days: 7
  config: {}

# ---------------------------------------------------------------------------
# Index estimator settings
# ---------------------------------------------------------------------------
# A shorter half-life than the default. Under faster price movement, a
# fortnight-old observation is weaker evidence about today than it would be in a
# more stable economy, and the estimator should forget it faster.
index:
  observation_window_days: 7
  recency_half_life_days: 2
  min_observations_for_ci: 3
  bootstrap_draws: 500
  base_date: 2026-01-01

# ---------------------------------------------------------------------------
# Units
# ---------------------------------------------------------------------------
units:
  - { code: kg,    name: Kilogram,   name_local: Kilogramo,  dimension: mass,   base_unit_code: kg,    factor_to_base: 1 }
  - { code: g,     name: Gram,       name_local: Gramo,      dimension: mass,   base_unit_code: kg,    factor_to_base: 0.001 }
  - { code: l,     name: Litre,      name_local: Litro,      dimension: volume, base_unit_code: l,     factor_to_base: 1 }
  - { code: ml,    name: Millilitre, name_local: Mililitro,  dimension: volume, base_unit_code: l,     factor_to_base: 0.001 }
  - { code: piece, name: Piece,      name_local: Unidad,     dimension: count,  base_unit_code: piece, factor_to_base: 1 }
  - { code: pack,  name: Pack,       name_local: Paquete,    dimension: count,  base_unit_code: piece, factor_to_base: 1 }
  - { code: dozen, name: Dozen,      name_local: Docena,     dimension: count,  base_unit_code: piece, factor_to_base: 12 }

# ---------------------------------------------------------------------------
# Locations
# ---------------------------------------------------------------------------
# Spread deliberately beyond the northern urban belt. Amazonas and Delta
# Amacuro are reached by river and air rather than road, and an index sampling
# only Caracas and Maracaibo would miss where affordability is worst.
locations:
  - { name: Caracas,         name_local: Caracas,         slug: caracas,         admin1_name: Distrito Capital, admin1_code: VE-A, latitude: 10.4806, longitude: -66.9036, population_estimate: 2100000 }
  - { name: Maracaibo,       name_local: Maracaibo,       slug: maracaibo,       admin1_name: Zulia,            admin1_code: VE-V, latitude: 10.6427, longitude: -71.6125, population_estimate: 1650000 }
  - { name: Valencia,        name_local: Valencia,        slug: valencia,        admin1_name: Carabobo,         admin1_code: VE-G, latitude: 10.1620, longitude: -68.0077, population_estimate: 1400000 }
  - { name: Barquisimeto,    name_local: Barquisimeto,    slug: barquisimeto,    admin1_name: Lara,             admin1_code: VE-K, latitude: 10.0678, longitude: -69.3467, population_estimate: 1000000 }
  - { name: Maracay,         name_local: Maracay,         slug: maracay,         admin1_name: Aragua,           admin1_code: VE-D, latitude: 10.2469, longitude: -67.5958, population_estimate: 1050000 }
  - { name: Ciudad Guayana,  name_local: Ciudad Guayana,  slug: ciudad-guayana,  admin1_name: Bolívar,          admin1_code: VE-F, latitude: 8.3533,  longitude: -62.6528, population_estimate: 950000 }
  - { name: San Cristóbal,   name_local: San Cristóbal,   slug: san-cristobal,   admin1_name: Táchira,          admin1_code: VE-S, latitude: 7.7669,  longitude: -72.2250, population_estimate: 640000 }
  - { name: Maturín,         name_local: Maturín,         slug: maturin,         admin1_name: Monagas,          admin1_code: VE-N, latitude: 9.7457,  longitude: -63.1832, population_estimate: 540000 }
  - { name: Barcelona,       name_local: Barcelona,       slug: barcelona,       admin1_name: Anzoátegui,       admin1_code: VE-B, latitude: 10.1333, longitude: -64.7000, population_estimate: 490000 }
  - { name: Cumaná,          name_local: Cumaná,          slug: cumana,          admin1_name: Sucre,            admin1_code: VE-R, latitude: 10.4500, longitude: -64.1667, population_estimate: 400000 }
  - { name: Mérida,          name_local: Mérida,          slug: merida,          admin1_name: Mérida,           admin1_code: VE-L, latitude: 8.5897,  longitude: -71.1561, population_estimate: 330000 }
  - { name: Punto Fijo,      name_local: Punto Fijo,      slug: punto-fijo,      admin1_name: Falcón,           admin1_code: VE-I, latitude: 11.6947, longitude: -70.1997, population_estimate: 280000 }
  - { name: El Tigre,        name_local: El Tigre,        slug: el-tigre,        admin1_name: Anzoátegui,       admin1_code: VE-B, latitude: 8.8892,  longitude: -64.2531, population_estimate: 170000 }
  - { name: Guasdualito,     name_local: Guasdualito,     slug: guasdualito,     admin1_name: Apure,            admin1_code: VE-C, latitude: 7.2453,  longitude: -70.7322, population_estimate: 60000 }
  - { name: Tucupita,        name_local: Tucupita,        slug: tucupita,        admin1_name: Delta Amacuro,    admin1_code: VE-Y, latitude: 9.0575,  longitude: -62.0511, population_estimate: 90000 }
  - { name: Puerto Ayacucho, name_local: Puerto Ayacucho, slug: puerto-ayacucho, admin1_name: Amazonas,         admin1_code: VE-Z, latitude: 5.6639,  longitude: -67.6236, population_estimate: 90000 }

# ---------------------------------------------------------------------------
