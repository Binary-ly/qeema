    name_local: Cereal infantil (400g)
    category: infant_nutrition
    default_unit_code: pack
    default_quantity: 1
    variants: [cereal infantil, papilla, compota de cereal, nestum, cerelac, baby cereal]

  # The staple. Precooked maize flour, not wheat — this is the single most
  # important difference from the default country's basket.
