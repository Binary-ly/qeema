# ---------------------------------------------------------------------------
# Basket
# ---------------------------------------------------------------------------
# Same nine categories as the default country, different composition. Maize
# flour carries the weight wheat carries there, and cooking gas somewhat less,
# because bottled water is a larger and less avoidable share of household
# spending where the piped supply is unreliable.
#
# Weights must sum to exactly 1.000000; the loader rejects the file otherwise.
basket:
  name: Cesta de Asequibilidad Infantil
  version: 1
  effective_from: 2026-01-01
  items:
    - { item: infant_formula_400g,          weight: 0.13, quantity: 1,  unit: pack,  category: infant_nutrition }
    - { item: baby_cereal_400g,             weight: 0.05, quantity: 1,  unit: pack,  category: infant_nutrition }
    - { item: maize_flour_1kg,              weight: 0.11, quantity: 6,  unit: kg,    category: staples }
    - { item: rice_1kg,                     weight: 0.08, quantity: 3,  unit: kg,    category: staples }
    - { item: cooking_oil_1l,               weight: 0.08, quantity: 2,  unit: l,     category: staples }
    - { item: eggs_30,                      weight: 0.07, quantity: 30, unit: piece, category: protein }
    - { item: chicken_1kg,                  weight: 0.08, quantity: 2,  unit: kg,    category: protein }
    - { item: tomatoes_1kg,                 weight: 0.05, quantity: 3,  unit: kg,    category: produce }
    - { item: ors_sachet,                   weight: 0.04, quantity: 6,  unit: piece, category: medicine }
    - { item: paracetamol_suspension_60ml,  weight: 0.04, quantity: 60, unit: ml,    category: medicine }
    - { item: amoxicillin_suspension_60ml,  weight: 0.03, quantity: 60, unit: ml,    category: medicine }
    - { item: school_notebook_80p,          weight: 0.03, quantity: 4,  unit: piece, category: school }
    - { item: sanitary_pads_10,             weight: 0.06, quantity: 2,  unit: pack,  category: hygiene }
    - { item: cooking_gas_10kg,             weight: 0.08, quantity: 1,  unit: piece, category: fuel }
    - { item: drinking_water_20l,           weight: 0.07, quantity: 80, unit: l,     category: water }

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
sources:
  - { type: reporter,       slug: community-reporters, name: Reporteros comunitarios, license: CC-BY-4.0 }
  - { type: partner_upload, slug: partner-uploads,     name: Organizaciones asociadas, license: CC-BY-4.0 }

# ---------------------------------------------------------------------------
# Synthetic demo data
# ---------------------------------------------------------------------------
# Reference prices in VES at the base date, used only to seed the generator.
# Plausible starting points for a demonstration, not measured values.
demo:
  seed: 20260101
  months: 6
  reporters_per_location: 4
  # Places reached by river or air rather than road run far dearer. The spread
  # here is wider than the default country's on purpose: it gives the imputation
  # model a harder problem than a gentle gradient would.
  regional_premium:
    puerto-ayacucho: 1.52
    tucupita: 1.41
    guasdualito: 1.33
    el-tigre: 1.12
    san-cristobal: 1.09
    merida: 1.07
    punto-fijo: 1.11
  # Materially faster than the default country. The estimator's shorter
  # half-life above is the response to it, and the pair together exercise
  # settings that would otherwise be constants.
  monthly_inflation: 0.045
  fx_start_parallel: 52.0
  fx_start_official: 44.5
  reference_prices:
    infant_formula_400g: 310.0
    baby_cereal_400g: 168.0
    maize_flour_1kg: 32.0
    rice_1kg: 41.0
    cooking_oil_1l: 78.0
    eggs_30: 195.0
    chicken_1kg: 118.0
    tomatoes_1kg: 36.0
    ors_sachet: 22.0
    paracetamol_suspension_60ml: 95.0
    amoxicillin_suspension_60ml: 165.0
    school_notebook_80p: 28.0
    sanitary_pads_10: 74.0
    cooking_gas_10kg: 240.0
    drinking_water_20l: 3.4
