# SPDX-License-Identifier: Apache-2.0
#
# Qeema — one-command demo stack.
#
#   docker compose up
#
# On a clean machine with nothing but Docker installed, this brings up the whole
# platform, migrated and seeded with a six-month synthetic history, and serves a
# working dashboard and public API. No manual steps (constraint C2).
#
# Every image is OSI-licensed and pulled from a public registry; nothing here
# needs a commercial account (constraint C1).

name: qeema

x-app-env: &app-env
  APP_NAME: Qeema
  APP_ENV: ${APP_ENV:-production}
  # Demo key for local use only — see SECURITY.md. Must decode to exactly 32
  # bytes: AES-256 rejects anything else, and because only session and cookie
  # encryption use it, a wrong length breaks the admin panel while leaving the
  # public API working, which is a confusing way to fail.
  APP_KEY: ${APP_KEY:-base64:UWVlbWFEZW1vS2V5TG9jYWxVc2VPbmx5Q2hhbmdlTWU=}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}

  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-qeema}
  DB_USERNAME: ${POSTGRES_USER:-qeema}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-qeema}

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  # Must exceed every job timeout and every Horizon supervisor timeout, or a
  # slow job is handed to a second worker while the first is still running.
  REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-300}

  # The ingestion pipeline and the publication clock. Defaults are sensible for
  # a pilot; see docs/deployment.md before changing any of them.
  QEEMA_PIPELINE_QUEUE_LIVE: ${QEEMA_PIPELINE_QUEUE_LIVE:-pipeline-live}
  QEEMA_PIPELINE_QUEUE_BULK: ${QEEMA_PIPELINE_QUEUE_BULK:-pipeline-bulk}
  QEEMA_PIPELINE_MAX_ATTEMPTS: ${QEEMA_PIPELINE_MAX_ATTEMPTS:-5}
  QEEMA_PIPELINE_SWEEP_AGE: ${QEEMA_PIPELINE_SWEEP_AGE:-120}
  QEEMA_PIPELINE_SWEEP_LIMIT: ${QEEMA_PIPELINE_SWEEP_LIMIT:-500}
  QEEMA_PIPELINE_SCORE_WINDOW_HOURS: ${QEEMA_PIPELINE_SCORE_WINDOW_HOURS:-24}
  QEEMA_INDEX_DRAIN_LIMIT: ${QEEMA_INDEX_DRAIN_LIMIT:-500}
  QEEMA_INDEX_PUBLISH_GRACE: ${QEEMA_INDEX_PUBLISH_GRACE:-60}
  QEEMA_INDEX_BACKFILL_DAYS: ${QEEMA_INDEX_BACKFILL_DAYS:-3}

  QEEMA_ML_URL: http://ml:8000
  QEEMA_COUNTRIES_PATH: /countries
  # The demo publishes a synthetic six-month history: every "reporter" in it is
  # generated, so there is nobody for the disclosure threshold to protect and
  # exact observation counts are the more useful thing to show. Set here rather
  # than inherited so that turning it back on for a real deployment is a visible
  # one-line decision — the application default is the protective value. See
  # docs/do-no-harm.md before running this stack with real reporters.
  QEEMA_MIN_DISCLOSED_OBSERVATIONS: ${QEEMA_MIN_DISCLOSED_OBSERVATIONS:-1}

  QEEMA_SEED_COUNTRIES: ${QEEMA_SEED_COUNTRIES:-*}
  QEEMA_SEED_DEMO: ${QEEMA_SEED_DEMO:-true}
  QEEMA_SEED_DEMO_MONTHS: ${QEEMA_SEED_DEMO_MONTHS:-6}

services:

  postgres:
    # pgvector's own image, so the extension is present without a custom build.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qeema}
      POSTGRES_USER: ${POSTGRES_USER:-qeema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qeema}
      # Faster, deterministic initdb for a demo database.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates vector, pg_trgm and the qeema_eval schema before any migration.
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qeema} -d ${POSTGRES_DB:-qeema}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    # Redis 8+ only: from 8.0 Redis offers an AGPLv3 option, which is
    # OSI-approved, satisfying the all-OSI-dependencies constraint. Set
    # REDIS_IMAGE=valkey/valkey:8 for a BSD-licensed, wire-compatible drop-in.
    image: ${REDIS_IMAGE:-redis:8-alpine}
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  ml:
    build:
      context: .
      dockerfile: infra/docker/ml.Dockerfile
      args:
        EMBEDDING_MODEL: ${QEEMA_EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
    environment:
      QEEMA_ML_ENVIRONMENT: ${APP_ENV:-production}
      QEEMA_ML_EMBEDDING_MODEL: ${QEEMA_EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      QEEMA_ML_DATABASE_URL: postgresql://${POSTGRES_USER:-qeema}:${POSTGRES_PASSWORD:-qeema}@postgres:5432/${POSTGRES_DB:-qeema}
      QEEMA_ML_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      QEEMA_ML_NOWCAST_MODEL_DIR: ${QEEMA_ML_NOWCAST_MODEL_DIR:-/models}
    volumes:
      # Fitted nowcast models. Without a volume they live only in the
      # container's memory, so every restart drops each country back to a
      # fallback heuristic until the next scheduled training run.
      - ml-models:/models
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ML_PORT:-8000}:8000"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
    environment: *app-env
    volumes:
      # Country configuration is read at seed time and is the only place country
      # facts live, so it is mounted rather than baked in — an operator adding a
      # country should not need to rebuild the image.
      - ./countries:/countries:ro
      - app-storage:/app/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The app must not start bootstrapping until the ML service can actually
      # serve inference, or the first seeded submissions resolve by fallback.
      ml:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
    entrypoint: ["/usr/local/bin/entrypoint-worker"]
    environment: *app-env
    volumes:
      - ./countries:/countries:ro
      - app-storage:/app/storage/app
    depends_on:
      # Waits on app, not just postgres: the app owns migrations, and a worker
      # that starts against a half-migrated schema fails in confusing ways.
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # The clock. Without it the pipeline still resolves submissions as they
  # arrive, but corrections never reach published figures and no new calendar
  # day is ever published — the index freezes on the day of deployment while
  # every container reports healthy.
  #
  # Its own service rather than a second process in the worker: a scheduler that
  # dies inside a healthy-looking worker is the silent failure it exists to
  # prevent. Reuses the app image, so this costs a container and no build time.
  scheduler:
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
    entrypoint: ["/usr/local/bin/entrypoint-scheduler"]
    environment: *app-env
    volumes:
      - ./countries:/countries:ro
      - app-storage:/app/storage/app
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Reads back the heartbeat the schedule writes every minute. A stopped
      # clock becomes an unhealthy container within a few minutes rather than an
      # index nobody noticed had stalled.
      test: ["CMD-SHELL", "php artisan qeema:scheduler:heartbeat --check"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  app-storage:
  ml-models:
