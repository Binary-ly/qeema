<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!--
    The share card, as a page.

    This is what a link to the platform looks like in a chat, a feed or an
    email: the one frame most people will ever see of it, and the one that had
    nothing in it at all. Rasterised to public/og.png by infra/scripts/og-card.mjs,
    because link previews will not render SVG and will not load webfonts.

    Brand only, on purpose. No number and no country: a figure baked into a
    static image is stale the day after it is generated, and a country name
    would make one deployment's card every deployment's card (constraint C3
    covers application source, but the principle covers this too). The mark,
    the wordmark, the device and the sentence are the things that are true of
    every deployment on every day.

    Fonts are the same self-hosted files the site uses, loaded from the
    repository over file://, so the card is set in the product's own type.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    @font-face {
        font-family: 'Instrument Serif';
        src: url('../../api/resources/fonts/instrument-serif-latin.woff2') format('woff2');
        font-weight: 400;
    }
    @font-face {
        font-family: 'DM Sans';
        src: url('../../api/resources/fonts/dm-sans-latin.woff2') format('woff2');
        font-weight: 400;
    }
    @font-face {
        font-family: 'Amiri';
        src: url('../../api/resources/fonts/amiri-arabic.woff2') format('woff2');
        font-weight: 400;
    }

    html, body { margin: 0; }
    body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b1f2a;
        color: #fff;
        font-family: 'DM Sans', system-ui, sans-serif;
        position: relative;
    }
    .frame {
        position: absolute;
        inset: 0;
        padding: 68px 76px 64px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 30px;
    }
    .mark { width: 112px; height: 112px; display: block; }
    .word {
        display: flex;
        flex-direction: column;
        line-height: 1;
    }
    .word__latin {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 92px;
        letter-spacing: -0.02em;
    }
    .word__arabic {
        font-family: 'Amiri', serif;
        font-size: 44px;
        color: #b9cbd6;
        margin-top: 4px;
        direction: rtl;
        text-align: left;
    }
    .tagline {
        font-size: 36px;
        line-height: 1.3;
        color: #dce8ee;
        max-width: 820px;
        margin: 0;
    }
    .fifteen {
        display: flex;
        align-items: flex-end;
        gap: 9px;
        height: 132px;
        width: 100%;
    }
    .fifteen span {
        flex: 1 1 0;
        border-radius: 3px;
        background: #1cabe2;
        height: var(--h);
    }
    .fifteen span.is-hollow {
        background: transparent;
        box-shadow: inset 0 0 0 2.5px rgba(255, 255, 255, 0.42);
    }
    .rule {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 8px;
        background: #1cabe2;
    }
</style>
</head>
<body>
<div class="frame">
    <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <g fill="#1cabe2">
                <rect x="8.7" y="9.2" width="2.6" height="9.7" rx="1.3" />
                <rect x="12.7" y="5.2" width="2.6" height="15.5" rx="1.3" />
                <rect x="16.7" y="7.2" width="2.6" height="13.5" rx="1.3" />
                <rect x="20.7" y="10.7" width="2.6" height="8.2" rx="1.3" />
            </g>
            <path d="M5 14 Q16 27 27 14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" />
        </svg>
        <div class="word">
            <span class="word__latin">Qeema</span>
            <span class="word__arabic">قيمة</span>
        </div>
    </div>

    <p class="tagline">What it costs to meet one child's basic needs for a month, tracked where people live.</p>

    <!-- The device, not the data: a fixed rhythm of lit and hollow bars. -->
    <div class="fifteen" aria-hidden="true">
        <span style="--h:100%" class="is-hollow"></span>
        <span style="--h:88%"></span>
        <span style="--h:84%" class="is-hollow"></span>
        <span style="--h:78%"></span>
        <span style="--h:72%"></span>
        <span style="--h:70%" class="is-hollow"></span>
        <span style="--h:66%"></span>
        <span style="--h:62%" class="is-hollow"></span>
        <span style="--h:60%" class="is-hollow"></span>
        <span style="--h:56%"></span>
        <span style="--h:54%" class="is-hollow"></span>
        <span style="--h:50%" class="is-hollow"></span>
        <span style="--h:48%"></span>
        <span style="--h:44%" class="is-hollow"></span>
        <span style="--h:40%" class="is-hollow"></span>
    </div>
</div>
<div class="rule"></div>
</body>
</html>
