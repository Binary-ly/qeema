;
; Live-iteration only, mounted by compose.iterate.yml. Never part of a real
; deployment — php.ini's `opcache.validate_timestamps = 0` is the right setting
; for production and this file exists to turn it off for one specific job.
;
; With validation off, PHP never re-checks a file's mtime, so a changed class or
; a recompiled Blade view is invisible until the process restarts. That is
; exactly what you want on a server serving traffic, and it silently swallows
; every edit while somebody is working on the front end: the file on disk is
; right, the compiled view is right, and the page keeps rendering the previous
; version with nothing anywhere reporting a problem.
;
; conf.d is scanned alphabetically after the main ini, so this wins.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
