; Runtime PHP configuration for the Qeema app container.

memory_limit = 512M
max_execution_time = 60
post_max_size = 24M
upload_max_filesize = 16M

; Reporter photos and partner spreadsheets are the two upload paths; 16M covers
; a downscaled photo and a large partner workbook without inviting abuse of a
; publicly reachable endpoint.
max_file_uploads = 10

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
