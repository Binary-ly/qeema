[project]
name = "qeema-ml"
version = "0.1.0"
description = "Qeema ML service: product matching, anomaly scoring and price nowcasting for the open affordability index"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
    # --- service ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # --- data ---
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "sqlalchemy>=2.0",
    # --- matching ---
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "rapidfuzz>=3.10",
    # --- anomaly + nowcasting ---
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
    # --- observability ---
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Validates the real service's responses against the same contract the PHP
    # test double is validated against.
    "jsonschema>=4.23",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qeema_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: tests that load real model weights (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["src/qeema_ml"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    "A003",
    # RUF001/2/3 flag "ambiguous" Unicode — a homoglyph-spoofing check that
    # assumes Latin text. This codebase matches Arabic product names, so every
    # legitimate Arabic literal trips it (ARABIC LETTER ALEF "looks like" a
    # Latin l). Keeping it enabled would mean a blanket noqa on every Arabic
    # string, which is worse than turning it off deliberately here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
